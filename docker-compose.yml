services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forbright_app
      POSTGRES_PASSWORD: forbright_app_password
      POSTGRES_DB: forbright_app_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forbright_app -d forbright_app_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./services/forwarder
    environment:
      PORT: 3000
      INGEST_URL: ${INGEST_URL:-http://ingest:8080/ingest}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  ingest:
    build: ./services/ingest
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    environment:
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://forbright_app:forbright_app_password@db:5432/forbright_app_db
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
